name: Aim mouse sensitivity patch

on:
  push:
    branches:
      - feature/aim-mouse-sensitivity

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply aim sensitivity patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected block not found in {path}")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              "include/sf/platform/player_input.hpp",
              '''inline constexpr auto keyboard_mouse_action_count =
              static_cast<std::size_t>(KeyboardMouseAction::count);

          struct KeyboardMouseBindings {
            std::array<KeyboardMouseInput, keyboard_mouse_action_count> values{};
''',
              '''inline constexpr auto keyboard_mouse_action_count =
              static_cast<std::size_t>(KeyboardMouseAction::count);

          inline constexpr double minimum_aim_mouse_sensitivity = 0.10;
          inline constexpr double maximum_aim_mouse_sensitivity = 2.00;
          inline constexpr double default_aim_mouse_sensitivity = 1.00;

          struct KeyboardMouseBindings {
            std::array<KeyboardMouseInput, keyboard_mouse_action_count> values{};
            // Multiplies native raw relative mouse counts while RMB/manual aim is held.
            // 1.0 preserves the current product-tuned first-person response.
            double aim_mouse_sensitivity{default_aim_mouse_sensitivity};
''')

          replace_once(
              "src/platform/psycross_scene_runtime.inc",
              '''  auto previous_dynamic_fire = false;
          sf::platform::PlayerInputMapper player_input{
              sf::platform::PlayerInputConfiguration{
''',
              '''  auto previous_dynamic_fire = false;
          const auto aim_mouse_sensitivity = std::clamp(
              input_.aim_mouse_sensitivity,
              sf::platform::minimum_aim_mouse_sensitivity,
              sf::platform::maximum_aim_mouse_sensitivity);
          sf::platform::PlayerInputMapper player_input{
              sf::platform::PlayerInputConfiguration{
''')

          replace_once(
              "src/platform/psycross_scene_runtime.inc",
              '''          .mouse_yaw_sensitivity =
              sf::platform::first_person_mouse_yaw_sensitivity,
          .mouse_pitch_sensitivity =
              sf::platform::first_person_mouse_pitch_sensitivity,
''',
              '''          .mouse_yaw_sensitivity =
              sf::platform::first_person_mouse_yaw_sensitivity *
              aim_mouse_sensitivity,
          .mouse_pitch_sensitivity =
              sf::platform::first_person_mouse_pitch_sensitivity *
              aim_mouse_sensitivity,
''')

          replace_once(
              "apps/syphon_filter/launcher/settings.cpp",
              '''constexpr int minimum_resolution_width = 320;
          constexpr int minimum_resolution_height = 240;
''',
              '''constexpr int minimum_resolution_width = 320;
          constexpr int minimum_resolution_height = 240;
          constexpr int aim_mouse_sensitivity_storage_scale = 1000;
          constexpr int minimum_aim_mouse_sensitivity_scaled = static_cast<int>(
              minimum_aim_mouse_sensitivity * aim_mouse_sensitivity_storage_scale);
          constexpr int maximum_aim_mouse_sensitivity_scaled = static_cast<int>(
              maximum_aim_mouse_sensitivity * aim_mouse_sensitivity_storage_scale);

          int encodeAimMouseSensitivity(double value) noexcept {
            const auto clamped = std::clamp(value, minimum_aim_mouse_sensitivity,
                                            maximum_aim_mouse_sensitivity);
            return static_cast<int>(clamped * aim_mouse_sensitivity_storage_scale +
                                    0.5);
          }
''')

          replace_once(
              "apps/syphon_filter/launcher/settings.cpp",
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            check(profileIntegerEquals(path, L"KeyboardMouse", key.c_str(),
                                       static_cast<int>(input[action])));
          }
''',
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            check(profileIntegerEquals(path, L"KeyboardMouse", key.c_str(),
                                       static_cast<int>(input[action])));
          }
          check(profileIntegerEquals(path, L"KeyboardMouse", L"AimMouseSensitivity",
                                     encodeAimMouseSensitivity(
                                         input.aim_mouse_sensitivity)));
''')

          replace_once(
              "apps/syphon_filter/launcher/settings.cpp",
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            const auto fallback = static_cast<int>(input[action]);
            const auto loaded = static_cast<KeyboardMouseInput>(
                readProfileInteger(path, L"KeyboardMouse", key.c_str(), fallback));
            if (isValidKeyboardMouseInput(loaded)) {
              input[action] = loaded;
            }
          }

          auto loaded_controller = graphics.controller_bindings;
''',
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            const auto fallback = static_cast<int>(input[action]);
            const auto loaded = static_cast<KeyboardMouseInput>(
                readProfileInteger(path, L"KeyboardMouse", key.c_str(), fallback));
            if (isValidKeyboardMouseInput(loaded)) {
              input[action] = loaded;
            }
          }
          const auto aim_mouse_sensitivity = readProfileInteger(
              path, L"KeyboardMouse", L"AimMouseSensitivity",
              encodeAimMouseSensitivity(input.aim_mouse_sensitivity));
          if (aim_mouse_sensitivity >= minimum_aim_mouse_sensitivity_scaled &&
              aim_mouse_sensitivity <= maximum_aim_mouse_sensitivity_scaled) {
            input.aim_mouse_sensitivity =
                static_cast<double>(aim_mouse_sensitivity) /
                aim_mouse_sensitivity_storage_scale;
          }

          auto loaded_controller = graphics.controller_bindings;
''')

          replace_once(
              "apps/syphon_filter/launcher/settings.cpp",
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            static_cast<void>(writeProfileInteger(
                path, L"KeyboardMouse", key.c_str(),
                static_cast<int>(input[action])));
          }
          static_cast<void>(
              writeControllerBindingsFile(path, graphics.controller_bindings));
''',
              '''  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {
            const auto action = static_cast<KeyboardMouseAction>(index);
            const auto key = widenAscii(keyboardMouseActionConfigKey(action));
            static_cast<void>(writeProfileInteger(
                path, L"KeyboardMouse", key.c_str(),
                static_cast<int>(input[action])));
          }
          static_cast<void>(writeProfileInteger(
              path, L"KeyboardMouse", L"AimMouseSensitivity",
              encodeAimMouseSensitivity(input.aim_mouse_sensitivity)));
          static_cast<void>(
              writeControllerBindingsFile(path, graphics.controller_bindings));
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.hpp",
              '''  static constexpr int input_device_control_id = 2006;
          static constexpr int controller_protocol_control_id = 1021;
''',
              '''  static constexpr int input_device_control_id = 2006;
          static constexpr int aim_mouse_sensitivity_control_id = 2007;
          static constexpr int controller_protocol_control_id = 1021;
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''constexpr std::size_t controller_controls_row_count =
              game::controller_action_count + 1U;

          std::wstring widenAscii(std::string_view text) {
''',
              '''constexpr std::size_t controller_controls_row_count =
              game::controller_action_count + 1U;
          constexpr std::array<double, 12U> aim_mouse_sensitivity_values{
              0.10, 0.15, 0.20, 0.25, 0.33, 0.50,
              0.67, 0.75, 1.00, 1.25, 1.50, 2.00,
          };

          std::wstring aimMouseSensitivityLabel(double value) {
            return std::to_wstring(static_cast<int>(value * 100.0 + 0.5)) + L"%";
          }

          std::size_t nearestAimMouseSensitivity(double value) noexcept {
            auto best = std::size_t{};
            auto best_error = std::numeric_limits<double>::max();
            for (std::size_t index = 0U; index < aim_mouse_sensitivity_values.size();
                 ++index) {
              const auto delta = value - aim_mouse_sensitivity_values[index];
              const auto error = delta * delta;
              if (error < best_error) {
                best = index;
                best_error = error;
              }
            }
            return best;
          }

          std::wstring widenAscii(std::string_view text) {
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''#include <cstdint>
          #include <optional>
''',
              '''#include <cstdint>
          #include <limits>
          #include <optional>
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  HWND vibration_checkbox{};
            HWND assignments_label{};
''',
              '''  HWND vibration_checkbox{};
            HWND aim_sensitivity_label{};
            HWND aim_sensitivity_combo{};
            HWND assignments_label{};
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  void cancelBindingCapture() {
''',
              '''  void refreshAimSensitivityCombo() {
            if (keyboard == nullptr || aim_sensitivity_combo == nullptr) {
              return;
            }
            SendMessageW(aim_sensitivity_combo, CB_RESETCONTENT, 0, 0);
            for (const auto value : aim_mouse_sensitivity_values) {
              const auto label = aimMouseSensitivityLabel(value);
              SendMessageW(aim_sensitivity_combo, CB_ADDSTRING, 0,
                           reinterpret_cast<LPARAM>(label.c_str()));
            }
            SendMessageW(
                aim_sensitivity_combo, CB_SETCURSEL,
                static_cast<WPARAM>(
                    nearestAimMouseSensitivity(keyboard->aim_mouse_sensitivity)),
                0);
          }

            void cancelBindingCapture() {
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''    SetWindowTextW(vibration_checkbox, text.vibration.data());
            SetWindowTextW(assignments_label, text.assignments.data());
''',
              '''    SetWindowTextW(vibration_checkbox, text.vibration.data());
            SetWindowTextW(aim_sensitivity_label,
                           text.aim_mouse_sensitivity.data());
            refreshAimSensitivityCombo();
            SetWindowTextW(assignments_label, text.assignments.data());
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''    refreshList();
            if (controller_mode) {
''',
              '''    EnableWindow(aim_sensitivity_combo, controller_mode ? FALSE : TRUE);
            refreshList();
            if (controller_mode) {
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  impl_->vibration_checkbox =
              add(createControl(parent, L"BUTTON", L"", WS_TABSTOP | BS_AUTOCHECKBOX,
                                controller_vibration_control_id, style.ui_font));
            impl_->assignments_label =
''',
              '''  impl_->vibration_checkbox =
              add(createControl(parent, L"BUTTON", L"", WS_TABSTOP | BS_AUTOCHECKBOX,
                                controller_vibration_control_id, style.ui_font));
            impl_->aim_sensitivity_label =
              add(createControl(parent, L"STATIC", L"", 0, 0, style.ui_font));
            impl_->aim_sensitivity_combo =
              add(createControl(parent, L"COMBOBOX", L"",
                                WS_TABSTOP | CBS_DROPDOWNLIST,
                                aim_mouse_sensitivity_control_id, style.ui_font));
            impl_->assignments_label =
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  if (impl_->controls.size() != 14U) {
''',
              '''  if (impl_->controls.size() != 16U) {
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  MoveWindow(impl_->defaults_button, action_left, body_top + 104, action_width,
                 38, TRUE);
            MoveWindow(impl_->status, action_left, body_top + 158, action_width, 74,
                 TRUE);
            MoveWindow(impl_->hint, action_left, body_top + 244, action_width,
                 std::max(42, body_height - 244), TRUE);
''',
              '''  MoveWindow(impl_->defaults_button, action_left, body_top + 104, action_width,
                 38, TRUE);
            MoveWindow(impl_->aim_sensitivity_label, action_left, body_top + 154,
                       action_width, 22, TRUE);
            MoveWindow(impl_->aim_sensitivity_combo, action_left, body_top + 178,
                       action_width, 120, TRUE);
            MoveWindow(impl_->status, action_left, body_top + 218, action_width, 66,
                 TRUE);
            MoveWindow(impl_->hint, action_left, body_top + 296, action_width,
                 std::max(42, body_height - 296), TRUE);
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''  if (id == controller_protocol_control_id && notification == CBN_SELCHANGE) {
            impl_->applyProtocolSelection();
            return true;
          }
''',
              '''  if (id == controller_protocol_control_id && notification == CBN_SELCHANGE) {
            impl_->applyProtocolSelection();
            return true;
          }
            if (id == aim_mouse_sensitivity_control_id &&
                notification == CBN_SELCHANGE && impl_->keyboard != nullptr) {
              const auto selection =
                  SendMessageW(impl_->aim_sensitivity_combo, CB_GETCURSEL, 0, 0);
              if (selection >= 0 &&
                  static_cast<std::size_t>(selection) <
                      aim_mouse_sensitivity_values.size()) {
                impl_->keyboard->aim_mouse_sensitivity =
                    aim_mouse_sensitivity_values[static_cast<std::size_t>(selection)];
              }
              return true;
            }
''')

          replace_once(
              "apps/syphon_filter/launcher/controls_page.cpp",
              '''    } else {
              *impl_->keyboard = defaultKeyboardMouseBindings();
            }
            impl_->capture.reset();
''',
              '''    } else {
              *impl_->keyboard = defaultKeyboardMouseBindings();
              impl_->refreshAimSensitivityCombo();
            }
            impl_->capture.reset();
''')

          replace_once(
              "apps/syphon_filter/launcher/text.hpp",
              '''  std::wstring_view vibration;
            std::wstring_view assignments;
''',
              '''  std::wstring_view vibration;
            std::wstring_view aim_mouse_sensitivity;
            std::wstring_view assignments;
''')

          replace_once(
              "apps/syphon_filter/launcher/text.cpp",
              '''            .vibration = L"Controller vibration",
                      .assignments = L"CONTROL ASSIGNMENTS",
''',
              '''            .vibration = L"Controller vibration",
                      .aim_mouse_sensitivity = L"RMB aim mouse sensitivity",
                      .assignments = L"CONTROL ASSIGNMENTS",
''')

          replace_once(
              "apps/syphon_filter/launcher/text.cpp",
              '''            .vibration = L"Вибрация",
                      .assignments = L"НАЗНАЧЕНИЯ",
''',
              '''            .vibration = L"Вибрация",
                      .aim_mouse_sensitivity =
                          L"Чувствительность мыши при прицеливании",
                      .assignments = L"НАЗНАЧЕНИЯ",
''')

          replace_once(
              "tests/launcher_settings_tests.cpp",
              '''    const auto input = sf::platform::defaultKeyboardMouseBindings();
''',
              '''    auto input = sf::platform::defaultKeyboardMouseBindings();
                input.aim_mouse_sensitivity = 0.25;
''')

          replace_once(
              "docs/CONTROLS.md",
              '''Mouse movement controls the sight only while Aim is held. Crouch plus movement
          is the stealth locomotion path; Roll plus Strafe selects a side roll. These are
          composed states, not separate bindable actions.
''',
              '''Mouse movement controls the sight only while Aim is held. **RMB aim mouse
          sensitivity / Чувствительность мыши при прицеливании** scales the existing
          raw-relative first-person response from 10% to 200%; 100% preserves the current
          default. The selected value is stored as `AimMouseSensitivity` in the
          `[KeyboardMouse]` section of `launcher.ini`. Crouch plus movement is the stealth
          locomotion path; Roll plus Strafe selects a side roll. These are composed states,
          not separate bindable actions.
''')

      - name: Configure core validation
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          cmake --preset windows-msvc

      - name: Build core validation
        shell: pwsh
        run: cmake --build --preset windows-release

      - name: Run core tests
        shell: pwsh
        run: ctest --preset windows-release --output-on-failure

      - name: Configure PsyCross app
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          cmake --preset windows-psycross

      - name: Build PsyCross app
        shell: pwsh
        run: cmake --build --preset windows-psycross-app-release

      - name: Commit validated feature
        shell: pwsh
        run: |
          Remove-Item .github/workflows/aim-sensitivity-patch.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "input: add configurable RMB aim mouse sensitivity"
          git push origin HEAD:feature/aim-mouse-sensitivity
