name: Aim patch diagnostics

on:
  push:
    branches:
      - feature/aim-mouse-sensitivity

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-run patch step and capture the exact failure
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/aim-sensitivity-patch.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply aim sensitivity patch\n'
          start = workflow.index(marker, workflow.index('steps:'))
          run_marker = '        run: |\n'
          run_start = workflow.index(run_marker, start) + len(run_marker)
          next_step = workflow.index('\n      - name:', run_start)
          block = workflow[run_start:next_step]
          script = textwrap.dedent(block)
          Path('apply_aim_patch_debug.py').write_text(script, encoding='utf-8')
          result = subprocess.run(['python', 'apply_aim_patch_debug.py'], text=True,
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          report = (
              f'returncode={result.returncode}\n\n'
              f'{result.stdout}\n'
          )
          Path('aim_patch_diagnostics.txt').write_text(report, encoding='utf-8')
          print(report)

      - name: Commit diagnostics
        shell: pwsh
        run: |
          git restore . ':!.github/workflows/aim-patch-diagnostics.yml' ':!aim_patch_diagnostics.txt'
          git clean -fd -e aim_patch_diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aim_patch_diagnostics.txt
          git commit -m "ci: capture aim patch diagnostics"
          git push origin HEAD:feature/aim-mouse-sensitivity
