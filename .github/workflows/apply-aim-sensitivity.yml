name: Apply and validate aim mouse sensitivity

on:
  push:
    branches:
      - feature/aim-mouse-sensitivity

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        id: patch
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          import traceback

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          try:
              replace_once(
                  'include/sf/platform/player_input.hpp',
                  'inline constexpr auto keyboard_mouse_action_count =\n'
                  '    static_cast<std::size_t>(KeyboardMouseAction::count);\n\n'
                  'struct KeyboardMouseBindings {\n'
                  '  std::array<KeyboardMouseInput, keyboard_mouse_action_count> values{};\n',
                  'inline constexpr auto keyboard_mouse_action_count =\n'
                  '    static_cast<std::size_t>(KeyboardMouseAction::count);\n\n'
                  'inline constexpr double minimum_aim_mouse_sensitivity = 0.10;\n'
                  'inline constexpr double maximum_aim_mouse_sensitivity = 2.00;\n'
                  'inline constexpr double default_aim_mouse_sensitivity = 1.00;\n\n'
                  'struct KeyboardMouseBindings {\n'
                  '  std::array<KeyboardMouseInput, keyboard_mouse_action_count> values{};\n'
                  '  // Scales raw relative mouse counts during RMB/manual first-person aim.\n'
                  '  // 1.0 preserves the existing product-tuned response.\n'
                  '  double aim_mouse_sensitivity{default_aim_mouse_sensitivity};\n')

              replace_once(
                  'src/platform/psycross_scene_runtime.inc',
                  '  auto previous_dynamic_fire = false;\n'
                  '  sf::platform::PlayerInputMapper player_input{\n'
                  '      sf::platform::PlayerInputConfiguration{\n',
                  '  auto previous_dynamic_fire = false;\n'
                  '  const auto aim_mouse_sensitivity = std::clamp(\n'
                  '      input_.aim_mouse_sensitivity,\n'
                  '      sf::platform::minimum_aim_mouse_sensitivity,\n'
                  '      sf::platform::maximum_aim_mouse_sensitivity);\n'
                  '  sf::platform::PlayerInputMapper player_input{\n'
                  '      sf::platform::PlayerInputConfiguration{\n')

              replace_once(
                  'src/platform/psycross_scene_runtime.inc',
                  '          .mouse_yaw_sensitivity =\n'
                  '              sf::platform::first_person_mouse_yaw_sensitivity,\n'
                  '          .mouse_pitch_sensitivity =\n'
                  '              sf::platform::first_person_mouse_pitch_sensitivity,\n',
                  '          .mouse_yaw_sensitivity =\n'
                  '              sf::platform::first_person_mouse_yaw_sensitivity *\n'
                  '              aim_mouse_sensitivity,\n'
                  '          .mouse_pitch_sensitivity =\n'
                  '              sf::platform::first_person_mouse_pitch_sensitivity *\n'
                  '              aim_mouse_sensitivity,\n')

              replace_once(
                  'apps/syphon_filter/launcher/settings.cpp',
                  'constexpr int minimum_resolution_width = 320;\n'
                  'constexpr int minimum_resolution_height = 240;\n',
                  'constexpr int minimum_resolution_width = 320;\n'
                  'constexpr int minimum_resolution_height = 240;\n'
                  'constexpr int minimum_aim_mouse_sensitivity_percent = 10;\n'
                  'constexpr int maximum_aim_mouse_sensitivity_percent = 200;\n\n'
                  'int encodeAimMouseSensitivity(double value) noexcept {\n'
                  '  const auto clamped = std::clamp(\n'
                  '      value, minimum_aim_mouse_sensitivity,\n'
                  '      maximum_aim_mouse_sensitivity);\n'
                  '  return static_cast<int>(clamped * 100.0 + 0.5);\n'
                  '}\n')

              replace_once(
                  'apps/syphon_filter/launcher/settings.cpp',
                  '  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {\n'
                  '    const auto action = static_cast<KeyboardMouseAction>(index);\n'
                  '    const auto key = widenAscii(keyboardMouseActionConfigKey(action));\n'
                  '    check(profileIntegerEquals(path, L"KeyboardMouse", key.c_str(),\n'
                  '                               static_cast<int>(input[action])));\n'
                  '  }\n'
                  '  for (const auto &metadata : game::controllerActionCatalog()) {\n',
                  '  for (std::size_t index = 0U; index < keyboard_mouse_action_count; ++index) {\n'
                  '    const auto action = static_cast<KeyboardMouseAction>(index);\n'
                  '    const auto key = widenAscii(keyboardMouseActionConfigKey(action));\n'
                  '    check(profileIntegerEquals(path, L"KeyboardMouse", key.c_str(),\n'
                  '                               static_cast<int>(input[action])));\n'
                  '  }\n'
                  '  check(profileIntegerEquals(\n'
                  '      path, L"KeyboardMouse", L"AimMouseSensitivity",\n'
                  '      encodeAimMouseSensitivity(input.aim_mouse_sensitivity)));\n'
                  '  for (const auto &metadata : game::controllerActionCatalog()) {\n')

              replace_once(
                  'apps/syphon_filter/launcher/settings.cpp',
                  '    if (isValidKeyboardMouseInput(loaded)) {\n'
                  '      input[action] = loaded;\n'
                  '    }\n'
                  '  }\n\n'
                  '  auto loaded_controller = graphics.controller_bindings;\n',
                  '    if (isValidKeyboardMouseInput(loaded)) {\n'
                  '      input[action] = loaded;\n'
                  '    }\n'
                  '  }\n'
                  '  const auto aim_mouse_sensitivity_percent = readProfileInteger(\n'
                  '      path, L"KeyboardMouse", L"AimMouseSensitivity",\n'
                  '      encodeAimMouseSensitivity(input.aim_mouse_sensitivity));\n'
                  '  if (aim_mouse_sensitivity_percent >=\n'
                  '          minimum_aim_mouse_sensitivity_percent &&\n'
                  '      aim_mouse_sensitivity_percent <=\n'
                  '          maximum_aim_mouse_sensitivity_percent) {\n'
                  '    input.aim_mouse_sensitivity =\n'
                  '        static_cast<double>(aim_mouse_sensitivity_percent) / 100.0;\n'
                  '  }\n\n'
                  '  auto loaded_controller = graphics.controller_bindings;\n')

              replace_once(
                  'apps/syphon_filter/launcher/settings.cpp',
                  '    static_cast<void>(writeProfileInteger(\n'
                  '        path, L"KeyboardMouse", key.c_str(),\n'
                  '        static_cast<int>(input[action])));\n'
                  '  }\n'
                  '  static_cast<void>(\n'
                  '      writeControllerBindingsFile(path, graphics.controller_bindings));\n',
                  '    static_cast<void>(writeProfileInteger(\n'
                  '        path, L"KeyboardMouse", key.c_str(),\n'
                  '        static_cast<int>(input[action])));\n'
                  '  }\n'
                  '  static_cast<void>(writeProfileInteger(\n'
                  '      path, L"KeyboardMouse", L"AimMouseSensitivity",\n'
                  '      encodeAimMouseSensitivity(input.aim_mouse_sensitivity)));\n'
                  '  static_cast<void>(\n'
                  '      writeControllerBindingsFile(path, graphics.controller_bindings));\n')

              replace_once(
                  'tests/launcher_settings_tests.cpp',
                  '    const auto input = sf::platform::defaultKeyboardMouseBindings();\n',
                  '    auto input = sf::platform::defaultKeyboardMouseBindings();\n'
                  '    input.aim_mouse_sensitivity = 0.25;\n')

              replace_once(
                  'docs/CONTROLS.md',
                  'Mouse movement controls the sight only while Aim is held. Crouch plus movement\n'
                  'is the stealth locomotion path; Roll plus Strafe selects a side roll. These are\n'
                  'composed states, not separate bindable actions.\n',
                  'Mouse movement controls the sight only while Aim is held. The optional\n'
                  '`AimMouseSensitivity` value in the `[KeyboardMouse]` section of\n'
                  '`launcher.ini` scales RMB/manual first-person mouse aim from 10 to 200 percent.\n'
                  '`100` preserves the default response; for example, `25` uses one quarter of the\n'
                  'default sensitivity. Crouch plus movement is the stealth locomotion path; Roll\n'
                  'plus Strafe selects a side roll. These are composed states, not separate\n'
                  'bindable actions.\n')

              Path('aim_patch_failure.txt').unlink(missing_ok=True)
          except Exception:
              Path('aim_patch_failure.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise

      - name: Check patch formatting
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: git diff --check

      - name: Configure, build and test
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          $log = 'aim_patch_build.log'
          function Run-Step([string]$Command) {
            "`n>>> $Command" | Tee-Object -FilePath $log -Append
            cmd /c $Command 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $Command" }
          }
          try {
            Run-Step 'cmake --preset windows-msvc'
            Run-Step 'cmake --build --preset windows-release'
            Run-Step 'ctest --preset windows-release --output-on-failure'
            Run-Step 'cmake --preset windows-psycross'
            Run-Step 'cmake --build --preset windows-psycross-app-release'
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
            throw
          }

      - name: Upload test executable
        if: steps.patch.outcome == 'success' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: syphon-filter-aim-sensitivity
          path: build/windows-psycross/Release/syphon_filter.exe
          if-no-files-found: error

      - name: Commit validated feature
        if: steps.patch.outcome == 'success' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-aim-sensitivity.yml
          Remove-Item aim_patch_build.log -ErrorAction SilentlyContinue
          Remove-Item aim_patch_failure.txt -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "input: add configurable RMB aim mouse sensitivity"
          git push origin HEAD:feature/aim-mouse-sensitivity

      - name: Commit failure diagnostics
        if: always() && (steps.patch.outcome == 'failure' || steps.build.outcome == 'failure')
        shell: pwsh
        run: |
          git restore .
          git clean -fd -e aim_patch_failure.txt -e aim_patch_build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aim_patch_failure.txt aim_patch_build.log 2>$null
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: capture aim sensitivity validation failure"
            git push origin HEAD:feature/aim-mouse-sensitivity
          }
