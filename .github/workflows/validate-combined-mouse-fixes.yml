name: Validate combined mouse fixes

on:
  push:
    branches:
      - local/combined-mouse-fixes

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch formatting
        shell: pwsh
        run: git diff --check origin/main...HEAD

      - name: Configure PsyCross build
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          cmake --preset windows-psycross

      - name: Build PsyCross app
        shell: pwsh
        run: cmake --build --preset windows-psycross-app-release

      - name: Upload combined executable
        uses: actions/upload-artifact@v4
        with:
          name: syphon-filter-combined-mouse-fixes
          path: build/windows-psycross/Release/syphon_filter.exe
          if-no-files-found: error
